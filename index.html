<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jungle</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0d08; }
  canvas { display: block; }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    padding: 10px 14px;
    background: rgba(10, 14, 10, 0.62);
    color: #d8e0c4;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    border: 1px solid rgba(216, 224, 196, 0.18);
    border-radius: 4px;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    pointer-events: none;
    transition: opacity 1.2s ease-out;
    user-select: none;
    z-index: 10;
  }
  #hud.fade { opacity: 0.18; }
  #hud.gone { opacity: 0; }
  #hud b { color: #f0e8c4; font-weight: 600; }
  #hud .row { white-space: nowrap; }
  #hud .row + .row { margin-top: 2px; }
</style>
</head>
<body>
<div id="hud">
  <div class="row"><b>WASD</b> &nbsp; walk / strafe &nbsp;&middot;&nbsp; <b>Mouse / Arrows</b> &nbsp; look around &nbsp;&middot;&nbsp; <b>Shift</b> &nbsp; run</div>
  <div class="row">follow the trail to the ancient temple and falls</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
